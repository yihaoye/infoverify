<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InfoVerify</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <header class="header">
      <div class="headerCopy">
        <div class="titleRow">
          <div class="title">InfoVerify</div>
          <span class="headerPill" id="modePill">本地 AI</span>
        </div>
        <div class="subtitle">默认使用本地 AI；会自动用 GDELT 最近新闻做交叉验证。云端 AI 计划中。</div>
      </div>

      <div class="modeSwitcher" role="group" aria-label="AI 模式切换">
        <button class="modeButton active" id="localModeButton" type="button">本地 AI</button>
        <button class="modeButton" id="cloudModeButton" type="button" disabled>云端 AI（计划中）</button>
      </div>
    </header>

    <main class="main">
      <section class="thinkingBanner" id="thinkingBanner" aria-live="polite">
        <div class="thinkingGlow"></div>
        <div class="thinkingContent">
          <div class="thinkingLabel">Thinking</div>
          <div class="thinkingText" id="thinkingText">正在推理...</div>
        </div>
        <div class="thinkingBars" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </section>

      <section class="card">
        <div class="cardTitle">结论</div>
        <div class="verdictRow">
          <span class="pill" id="verdictPill">—</span>
          <span class="confidence" id="confidence">—</span>
        </div>
        <div class="summary" id="summary">—</div>
      </section>

      <section class="card">
        <div class="cardTitle">AI 评估</div>
        <div class="verdictRow">
          <span class="pill" id="llmVerdictPill">—</span>
          <span class="confidence" id="llmConfidence">—</span>
        </div>
        <div class="summary" id="llmRationale">—</div>
      </section>

      <section class="card">
        <div class="cardTitle">可重复性</div>
        <div class="principleRow">
          <div class="principleLabel">得分</div>
          <div class="principleValue" id="reproScore">—</div>
        </div>
        <div class="summary principleNote" id="reproSummary">—</div>
        <div class="summary principleNote" id="reproNote">—</div>
      </section>

      <section class="card">
        <div class="cardTitle">交叉验证</div>
        <div class="principleRow">
          <div class="principleLabel">得分</div>
          <div class="principleValue" id="crossScore">—</div>
        </div>
        <div class="summary principleNote" id="crossSummary">—</div>
        <div class="sectionSubtitle">证据</div>
        <div class="evidence" id="evidence"></div>
        <div class="sectionSubtitle">GDELT 交叉验证</div>
        <div class="summary" id="gdeltSummary">—</div>
        <div class="summary principleNote" id="crossNote">—</div>
      </section>

      <section class="card">
        <div class="cardTitle">内容具体性</div>
        <div class="principleRow">
          <div class="principleLabel">得分</div>
          <div class="principleValue" id="detailScore">—</div>
        </div>
        <div class="summary principleNote" id="detailSummary">—</div>
        <div class="summary principleNote" id="detailNote">—</div>
      </section>

      <section class="card debugCard" id="debugCard" hidden>
        <div class="cardHeaderRow">
          <div class="cardTitle">调试信息</div>
          <button class="debugCopyButton" id="debugCopyButton" type="button">复制</button>
        </div>
        <div class="debugStatus" id="debugStatus">—</div>
        <pre class="debugTrace" id="debugTrace"></pre>
      </section>
    </main>

    <script src="./panel.js"></script>
  </body>
</html>
