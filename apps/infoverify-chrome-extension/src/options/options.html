<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InfoVerify Options</title>
    <style>
      body {
        font: 14px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        padding: 20px;
        max-width: 680px;
        margin: 0 auto;
        color: #111;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }
      .card {
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 16px;
        background: #fff;
      }
      .muted {
        color: #6b7280;
      }
      .list {
        margin: 12px 0 0;
        padding-left: 20px;
      }
      .list li + li {
        margin-top: 6px;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        padding: 3px 8px;
        border-radius: 999px;
        background: #eef2ff;
        color: #4338ca;
        font-size: 12px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>InfoVerify 设置</h1>
    <div class="card">
      <div class="tag">首发版默认配置</div>
      <p class="muted">
        当前版本默认只使用 Chrome 内置本地 AI，并自动通过 GDELT 最近新闻做交叉验证。
        云端 AI 仍然保留为“计划中”，暂不对外开放。
      </p>
      <ul class="list">
        <li>无需额外 API Key 或后端地址。</li>
        <li>右键选中文本时会优先分析选中文本；未选中时会分析当前页面。</li>
        <li>本地 AI 输出会结合三原则：可重复性、交叉验证、内容具体性。</li>
      </ul>
    </div>
  </body>
</html>
