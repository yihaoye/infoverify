<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InfoVerify Options</title>
    <style>
      body {
        font: 14px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        padding: 20px;
        max-width: 680px;
        margin: 0 auto;
        color: #111;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }
      .card {
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 16px;
        background: #fff;
      }
      .muted {
        color: #6b7280;
      }
      .list {
        margin: 12px 0 0;
        padding-left: 20px;
      }
      .list li + li {
        margin-top: 6px;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        padding: 3px 8px;
        border-radius: 999px;
        background: #eef2ff;
        color: #4338ca;
        font-size: 12px;
        font-weight: 600;
      }
      .field {
        margin-top: 16px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }
      select {
        width: 100%;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        padding: 10px 12px;
        font: inherit;
        background: #fff;
      }
      .help {
        margin-top: 8px;
        color: #6b7280;
        font-size: 13px;
      }
      .status {
        margin-top: 12px;
        font-size: 13px;
        color: #059669;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <h1>InfoVerify 设置</h1>
    <div class="card">
      <div class="tag">本地 AI 默认</div>
      <p class="muted">
        当前版本默认使用 Chrome 内置本地 AI，并自动通过 GDELT 最近新闻做交叉验证。
        提示词和模型输入都使用英文；模型输出语言可在下方选择。
      </p>
      <ul class="list">
        <li>右键选中文本时会优先分析选中文本；未选中时会分析当前页面。</li>
        <li>本地 AI 输出会结合三原则：可重复性、交叉验证、内容具体性。</li>
      </ul>
      <div class="field">
        <label for="outputLanguage">模型输出语言</label>
        <select id="outputLanguage">
          <option value="auto">自动（按浏览器语言）</option>
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="ja">日本語</option>
          <option value="zh">中文</option>
        </select>
        <div class="help">本地 AI 仍使用英文提示词；中文输出会在本地翻译层生成。</div>
      </div>
      <div class="status" id="saveStatus" aria-live="polite"></div>
    </div>
    <script src="./options.js"></script>
  </body>
</html>
