
services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379" # 映射本地 6379 端口到容器内
    volumes:
      - redis_data:/data # 持久化 Redis 数据
    command: ["redis-server", "--appendonly", "yes"] # 开启持久化（AOF 模式）

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node # 单节点模式
      - xpack.security.enabled=false # 关闭安全认证
    ports:
      - "9200:9200" # REST API
      - "9300:9300" # 集群通信
    volumes:
      - es_data:/usr/share/elasticsearch/data # 持久化 ES 数据

volumes:
  redis_data:
  es_data:
